[project]
name = "readback-planner"
version = "0.1.0"
description = "The deterministic floor: a grammar over the golden families"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-catalog",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_planner"]
