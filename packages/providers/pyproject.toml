[project]
name = "readback-providers"
version = "0.1.0"
description = "The provider registry, the router, the budget ledger and the cassettes"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-tracing",
  "langchain-core>=1.0",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_providers"]
