[project]
name = "readback-catalog"
version = "0.1.0"
description = "The catalog of the three warehouses, the synonym table and the lexical index"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "polars>=1.20",
  "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_catalog"]
