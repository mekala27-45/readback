[project]
name = "readback-agent"
version = "0.1.0"
description = "The LangGraph agent, a client of its own MCP server"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-gate",
  "readback-planner",
  "readback-providers",
  "readback-tracing",
  "readback-mcp-server",
  "langgraph>=1.0",
  "langchain-core>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_agent"]
