[project]
name = "readback-api"
version = "0.1.0"
description = "The FastAPI app: /mcp, /v1/chat, /v1/answers and /health"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-agent",
  "readback-mcp-server",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_api"]
