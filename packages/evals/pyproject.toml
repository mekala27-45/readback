[project]
name = "readback-evals"
version = "0.1.0"
description = "The golden set, the graders, the runner, the red team and the scorecard"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-agent",
  "readback-gate",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_evals"]
