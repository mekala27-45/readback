[project]
name = "readback-warehouse"
version = "0.1.0"
description = "DuckDB over the fetched tables, read only, and the SQL guard"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-catalog",
  "duckdb>=1.2",
  "sqlglot>=26.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_warehouse"]
