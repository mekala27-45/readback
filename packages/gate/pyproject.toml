[project]
name = "readback-gate"
version = "0.1.0"
description = "The readback gate: numeric tokens, exemptions, tolerance, verdicts"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_gate"]
