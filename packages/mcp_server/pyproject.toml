[project]
name = "readback-mcp-server"
version = "0.1.0"
description = "The MCP server over the three warehouses"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "readback-core",
  "readback-catalog",
  "readback-warehouse",
  "readback-gate",
  "readback-tracing",
  "mcp>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readback_mcp_server"]
