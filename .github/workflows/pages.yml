name: pages

# Builds the static site in web/ and publishes it to GitHub Pages under /readback. The site reads
# web/public/data, written from the committed results by scripts/export_site.py; the recorded session
# in it is committed, because recording needs the API running. The live API is named by the
# READBACK_API_URL repository variable; empty means the deployed address, and when the API is asleep
# the desk replays the recording and says so.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: The site's data from the committed results, and a check that it was committed fresh
        working-directory: .
        run: |
          uv sync --frozen
          uv run python scripts/export_site.py
          git diff --exit-code -- web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Against the test server's mock API, which refuses HEAD and answers a first 503, so the suite
      # passes whether the live API is awake or not and never needs the network.
      - name: Build against the mock API and run the end to end suite
        run: npm run build:e2e && npx playwright test
      - run: npm run build
        env:
          NEXT_PUBLIC_READBACK_API: ${{ vars.READBACK_API_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
      # Pages is enabled once in the repository settings with GitHub Actions as the source.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
