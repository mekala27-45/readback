# Hand written definitions for columns no dictionary or definitions document covers. Each is a
# hand edit, recorded in DECISIONS.md on 2026-10-23. A column absent from every source and from
# this file goes to the quarantine, named and counted; nothing is invented to fill the gap.
doorstep:
  households: "Households in the metro and year, from the American Community Survey one year table B11001."
  owner_households: "Owner occupied households in the metro and year, from table B25003."
  renter_households: "Renter occupied households in the metro and year, from table B25003."
  median_income: "Median household income in the metro and year, from table B19013, in nominal dollars."
  renter_median_income: "Median household income of renter households, from table B25119, in nominal dollars."
  owner_median_income: "Median household income of owner households, from table B25119, in nominal dollars."
  median_rent: "Median gross rent in the metro and year, from table B25064, in nominal dollars a month."
  population: "Resident population on July 1 of the year, from the Census population estimates."
  cbsa_title: "The name of the core based statistical area as the OMB delineation file in force spells it."
  cbsa_code: "The five digit code of the core based statistical area in the OMB delineation file in force."
  rate: "The Freddie Mac thirty year fixed mortgage rate, quarterly or yearly average, in percent."
  year: "The calendar year, or the American Community Survey year for census measures."
  kind: "Metropolitan or micropolitan, as the OMB delineation file classifies the area."
  raw_rank: "The metro's rank by payment share, least affordable first, before any adjustment."
  adjusted_rank: "The metro's rank by payment share after the shrinkage the fair ranking applies to small metros."
  housing_units: "Housing units in the metro and year, from table B25001."
  median_value_reported: "The census median value of owner occupied units as owners report it, table B25077."
turnaround:
  carrier: "The two letter code of the reporting carrier, as the Bureau of Transportation Statistics spells it."
  airport: "The three letter code of the airport, as the Bureau of Transportation Statistics spells it."
  origin: "The three letter code of the departure airport."
  dest: "The three letter code of the arrival airport."
  route: "The origin and destination airport codes joined by a hyphen."
  hub: "The three letter code of one of the twenty hubs the misconnect calculator covers."
  year: "The calendar year of the scheduled flight date."
  month: "The calendar month of the scheduled flight date, 1 to 12."
  flight_date: "The scheduled flight date, local to the departure airport."
ledger:
  period: "The reporting period of the row: a month, a quarter, a year or the whole window, named as the grain column says."
  grain: "The grain of the row: month, quarter, year or window."
  month: "The month end the row reports, inside the window 2023-09-01 to 2026-08-31."
  product: "The deposit or credit product the row reports."
  rule: "The name of the rule that raised the alert or the check."
  county_fips: "The five digit FIPS code of the county."
  group: "The group the row compares, as named in the dimension column."
  dimension: "The applicant characteristic the comparison is made over."
